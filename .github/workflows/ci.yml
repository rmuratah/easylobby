name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo +stable fmt --all --check
      # Default members are agent and mock-lcu; desktop requires a separate build.
      - name: Clippy
        run: cargo +stable clippy --locked --all-targets -- -D warnings
      - name: Tests
        run: cargo +stable test --locked

  ui:
    name: UI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Tests
        run: pnpm test

  desktop:
    name: Desktop (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal --component clippy
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build UI
        run: pnpm build:ui
      - name: Check desktop
        run: cargo +stable clippy --locked -p easylobby-desktop --all-targets -- -D warnings
      - name: Build desktop
        run: cargo +stable build --locked -p easylobby-desktop
