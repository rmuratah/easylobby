name: Release

# Gera o instalador do Windows e o latest.json do auto-update (#35).
# A release sai no repositório público rmuratah/easylobby-site (#567), porque
# este repositório vai ficar privado e os jogadores precisam baixar de lá.
# Dispare criando uma tag vX.Y.Z igual à versão do app; veja docs/release.md.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Instalador Windows
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A versão da tag tem que ser a mesma do app: é ela que o updater
      # compara com a versão instalada.
      - name: Check version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          app=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")
          cargo=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          echo "tag=$tag tauri.conf.json=$app Cargo.toml=$cargo"
          if [ "$tag" != "$app" ] || [ "$tag" != "$cargo" ]; then
            echo "::error::A tag v$tag não bate com a versão do app ($app no tauri.conf.json, $cargo no Cargo.toml)."
            exit 1
          fi

      # As notas da versão são a mensagem da tag anotada (git tag -a). Elas
      # vão para a release e para o latest.json, que o app mostra.
      - name: Read release notes
        id: notes
        shell: bash
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          {
            echo 'body<<EASYLOBBY_NOTES'
            git tag -l --format='%(contents)' "$GITHUB_REF_NAME"
            echo 'EASYLOBBY_NOTES'
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish draft release
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          # Token fine-grained só para rmuratah/easylobby-site (Contents: Read
          # and write). O GITHUB_TOKEN só escreve neste repositório.
          GITHUB_TOKEN: ${{ secrets.SITE_RELEASE_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          owner: rmuratah
          repo: easylobby-site
          # O commit da tag não existe no easylobby-site: a tag de lá nasce da main dele.
          releaseCommitish: main
          projectPath: desktop
          tauriScript: pnpm tauri
          args: --config src-tauri/tauri.release.conf.json
          tagName: ${{ github.ref_name }}
          releaseName: easylobby ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          # Fica como rascunho até alguém revisar e publicar: só a release
          # publicada chega aos jogadores pelo auto-update.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true

      # Transição (#567): quem instalou antes desta mudança ainda procura o
      # latest.json nas releases deste repositório. Copiamos o latest.json
      # (que já aponta para os arquivos do easylobby-site) para um rascunho
      # aqui. Pode sair depois que este repositório ficar privado.
      - name: Copy latest.json to this repository
        shell: bash
        env:
          SITE_TOKEN: ${{ secrets.SITE_RELEASE_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.tauri.outputs.releaseId }}
          NOTES: ${{ steps.notes.outputs.body }}
        run: |
          asset=$(GH_TOKEN="$SITE_TOKEN" gh api "repos/rmuratah/easylobby-site/releases/$RELEASE_ID/assets" \
            --jq '.[] | select(.name == "latest.json") | .id')
          if [ -z "$asset" ]; then
            echo "::error::latest.json não encontrado na release do easylobby-site."
            exit 1
          fi
          GH_TOKEN="$SITE_TOKEN" gh api -H "Accept: application/octet-stream" \
            "repos/rmuratah/easylobby-site/releases/assets/$asset" > latest.json
          gh release create "$GITHUB_REF_NAME" latest.json --repo "$GITHUB_REPOSITORY" \
            --draft --title "easylobby $GITHUB_REF_NAME" --notes "$NOTES"
