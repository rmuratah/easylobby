[package]
name = "easylobby-agent"
description = "Agente que conversa com a LCU API e expõe o canal /ws para a UI"
version.workspace = true
edition.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
# TLS nativo: o `riotgames.pem` é X.509 v1 e o rustls recusa (#8).
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }
# WebSocket WAMP da LCU (#9), com o mesmo TLS nativo do REST.
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
native-tls = "0.2"
tokio = { version = "1", features = ["fs", "macros", "net", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
# Canal /ws para a UI (#15) e os tipos TypeScript gerados do Rust.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws"] }
ts-rs = "12"

# Fora do Windows (o mock-lcu no Linux/macOS), a lista de processos vem do
# sysinfo. No Windows ele abre todos os processos com PROCESS_VM_READ e lê a
# memória deles, o que o Vanguard pode punir (VAN7003); lá a lista vem da
# Toolhelp (`lockfile::windows`).
[target.'cfg(not(windows))'.dependencies]
sysinfo = { version = "0.37", default-features = false, features = ["system"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
