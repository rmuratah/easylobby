[package]
name = "easylobby-agent"
description = "Agente que conversa com a LCU API e expõe o canal /ws para a UI"
version.workspace = true
edition.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# TLS nativo: o `riotgames.pem` é X.509 v1 e o rustls recusa (#8).
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }

# Só para o example `gravar_fixtures` (#5). O WAMP (#9) vai trazer as próprias
# dependências.
[dev-dependencies]
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
native-tls = "0.2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
