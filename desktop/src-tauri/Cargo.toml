[package]
name = "easylobby-desktop"
description = "Shell Tauri 2 do easylobby: embute o agente e mostra a UI React"
version.workspace = true
edition.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[lib]
name = "easylobby_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
easylobby-agent = { path = "../../agent" }
tauri = { version = "2", features = ["tray-icon"] }
# Caixa de erro nativa quando o canal do agente não sobe (#90, #91).
tauri-plugin-dialog = "2"
# Abrir o app de novo mostra a janela que já está aberta (#90).
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["net", "time"] }
