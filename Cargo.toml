[workspace]
resolver = "2"
members = ["agent", "mock-lcu", "desktop/src-tauri"]
# `cargo build` e `cargo test` na raiz rodam só o agente e o mock-lcu.
# O shell Tauri precisa da UI compilada (ui/dist) e de dependências do sistema;
# compile com `cargo build -p easylobby-desktop` ou `pnpm --dir desktop tauri dev`.
default-members = ["agent", "mock-lcu"]

[workspace.package]
version = "0.1.0"
edition = "2021"
repository = "https://github.com/rmuratah/easylobby"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Binário menor no instalador (#242): sem o LTO e com 16 codegen units, o
# agente sai com o dobro do tamanho. `panic` continua `unwind`: com `abort`,
# um pânico numa tarefa do tokio derrubaria o app inteiro.
[profile.release]
lto = true
codegen-units = 1
strip = true
